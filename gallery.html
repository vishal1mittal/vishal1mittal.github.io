<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gallery | Cambridge Computer Education</title>
		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700;800&display=swap"
			rel="stylesheet" />
		<!-- Icons -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<!-- CSS -->
		<link rel="stylesheet" href="css/style.css" />
		<link rel="stylesheet" href="css/variables.css" />
		<!-- Tailwind CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							primary: "#0f172a",
							secondary: "#2563eb",
						},
						fontFamily: {
							sans: ["Inter", "sans-serif"],
							heading: ["Outfit", "sans-serif"],
						},
					},
				},
			};
		</script>
		<!-- Scripts -->
		<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
		<script src="js/main.js" defer></script>
	</head>
	<body class="bg-white">
		<div id="header-placeholder"></div>

		<!-- Header -->
		<section class="bg-slate-50 pt-32 pb-12 border-b border-slate-200">
			<div class="container text-center">
				<h1
					class="text-4xl md:text-5xl font-heading font-bold mb-4 text-primary">
					Life at Cambridge
				</h1>
				<p class="text-slate-500 max-w-2xl mx-auto">
					A glimpse into our classrooms, workshops, and student
					activities.
				</p>
			</div>
		</section>

		<!-- Gallery Grid -->
		<section class="py-16">
			<div class="container">
				<div
					id="gallery-container"
					class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
					<!-- Content via JS -->
					<div class="col-span-full text-center py-10">
						Loading Gallery...
					</div>
				</div>
			</div>
		</section>

		<!-- Reviews Section -->
		<section class="py-16 bg-slate-50 border-t border-slate-200">
			<div class="container">
				<h2
					class="text-3xl font-heading font-bold text-center mb-12 text-primary">
					What People Say
				</h2>
				<div
					id="reviews-container"
					class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
					<!-- JS Injection -->
				</div>
			</div>
		</section>

		<div id="footer-placeholder"></div>
	</body>
</html>
