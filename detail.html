<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Course Details | Cambridge Computer Education</title>
		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700;800&display=swap"
			rel="stylesheet" />
		<!-- Icons -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<!-- CSS -->
		<link rel="stylesheet" href="css/style.css" />
		<link rel="stylesheet" href="css/variables.css" />
		<!-- Tailwind CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							primary: "#0f172a",
							secondary: "#2563eb",
						},
						fontFamily: {
							sans: ["Inter", "sans-serif"],
							heading: ["Outfit", "sans-serif"],
						},
					},
				},
			};
		</script>
		<!-- Scripts -->
		<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
		<script src="js/main.js?v=6" defer></script>
	</head>
	<body class="bg-slate-50">
		<div id="header-placeholder"></div>

		<!-- Course Detail Container -->
		<div id="course-detail-container" class="min-h-screen pt-32 pb-20">
			<!-- Loading State -->
			<div class="container text-center py-20">
				<div class="animate-pulse flex flex-col items-center">
					<div class="h-8 bg-slate-200 w-1/3 mb-4 rounded"></div>
					<div class="h-4 bg-slate-200 w-1/2 rounded"></div>
					<p class="mt-4 text-slate-400">Loading course details...</p>
				</div>
			</div>
		</div>

		<div id="footer-placeholder"></div>

		<!-- Include Form Handler -->
		<script src="js/form-handler.js"></script>
	</body>
</html>
